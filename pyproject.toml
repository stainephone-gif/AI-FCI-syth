[project]
name = "ai-fci-syth"
version = "0.1.0"
description = "Агент синтетической редакции для Telegram-канала лаборатории ФКИ"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "anthropic>=0.40",
    "gigachat>=0.2",
    "openai>=1.50",
    "apscheduler>=3.10,<4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.9",
    "jinja2>=3.1",
    "playwright>=1.62,<1.63",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.db", "app.bot", "app.publish", "app.ingest", "app.rank", "app.draft", "app.cards", "app.llm"]

[tool.setuptools.package-data]
"app.cards" = ["templates/*.html", "assets/fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
